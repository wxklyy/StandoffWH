name: Build StandoffWH

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual trigger

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          # install theos dependencies
          brew install dpkg ldid make

          # clone theos
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS

          # grab iOS 14.5 SDK (patched for theos)
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C $THEOS/sdks --strip-components=1

      - name: Build tweak (rootless for Dopamine)
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH

          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

          mkdir -p output
          ROOTLESS_DEB=$(find packages -name "*iphoneos-arm64.deb" | head -1)
          if [ -n "$ROOTLESS_DEB" ]; then
            cp "$ROOTLESS_DEB" output/StandoffWH_rootless_Dopamine.deb
          fi

          DYLIB=$(find .theos -type f -name "StandoffWH.dylib" ! -path "*.dSYM*" | head -1)
          if [ -n "$DYLIB" ]; then
            cp "$DYLIB" output/StandoffWH.dylib
          fi
        env:
          THEOS_DEVICE_IP: ""

      - name: Build rootful variant
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH

          make clean
          make package FINALPACKAGE=1

          ROOTFUL_DEB=$(find packages -name "*iphoneos-arm.deb" | head -1)
          if [ -n "$ROOTFUL_DEB" ]; then
            cp "$ROOTFUL_DEB" output/StandoffWH_rootful.deb
          fi
        env:
          THEOS_DEVICE_IP: ""

      - name: Collect artifacts
        run: |
          ls -la output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StandoffWH-release
          path: output/*
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: output/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
