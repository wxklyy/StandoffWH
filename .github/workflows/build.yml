name: Build StandoffWH

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual trigger

jobs:
  build:
    runs-on: macos-13
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          # install theos dependencies
          brew install dpkg ldid make

          # clone theos
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS

          # grab iOS 14.5 SDK (patched for theos)
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar xz -C $THEOS/sdks --strip-components=1

      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH

          # build the .deb package
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        env:
          THEOS_DEVICE_IP: ""

      - name: Build rootful variant
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH

          make clean
          make package FINALPACKAGE=1
        env:
          THEOS_DEVICE_IP: ""

      - name: Collect artifacts
        run: |
          mkdir -p output
          cp packages/*.deb output/ 2>/dev/null || true
          ls -la output/

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: StandoffWH-deb
          path: output/*.deb
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: output/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
